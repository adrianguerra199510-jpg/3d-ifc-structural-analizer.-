name: Compilar ejecutable de Windows

on:
  workflow_dispatch:
  push:
    branches:
      - claude/confident-edison-t6vckl
    paths:
      - "src/**"
      - "requirements.txt"
      - "herramientas/**"
      - "COMPILAR_PORTABLE.bat"
      - ".github/workflows/compilar-ejecutable-windows.yml"

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar la versión portable (mismo script que usa el usuario)
        shell: cmd
        run: echo N| call COMPILAR_PORTABLE.bat

      - name: Comprobar que se generó el portable con CalculiX
        shell: pwsh
        run: |
          if (-not (Test-Path C:/AnalizadorEstructuralIFC_portable/AnalizadorEstructuralIFC/AnalizadorEstructuralIFC.exe)) { throw "Falta el .exe" }
          if (-not (Test-Path C:/AnalizadorEstructuralIFC_portable/AnalizadorEstructuralIFC/ccx/ccx.exe)) { throw "Falta ccx.exe" }
          if (-not (Test-Path AnalizadorEstructuralIFC-portable.zip)) { throw "Falta el zip" }

      - name: Autoprueba de CalculiX en el portable ya compilado
        shell: pwsh
        run: |
          $exe = "C:/AnalizadorEstructuralIFC_portable/AnalizadorEstructuralIFC/AnalizadorEstructuralIFC.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--autoprueba" -Wait -PassThru
          Get-Content C:/AnalizadorEstructuralIFC_portable/AnalizadorEstructuralIFC/autoprueba.txt
          if ($p.ExitCode -ne 0) { throw "La autoprueba de CalculiX falló (código $($p.ExitCode))" }

      - name: Publicar como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: AnalizadorEstructuralIFC-portable
          path: AnalizadorEstructuralIFC-portable.zip
          retention-days: 90

      - name: Publicar como release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ejecutable-windows
          name: "Ejecutable de Windows (compilación automática)"
          body: |
            Ejecutable de Windows de la aplicación, generado automáticamente
            por GitHub Actions a partir de la rama `claude/confident-edison-t6vckl`
            (commit ${{ github.sha }}).

            Versión portable: **incluye CalculiX** (no hay que instalar nada).

            Descargue `AnalizadorEstructuralIFC-portable.zip`, descomprímalo y
            ejecute `AnalizadorEstructuralIFC.exe` dentro de la carpeta.
          files: AnalizadorEstructuralIFC-portable.zip
          prerelease: true
